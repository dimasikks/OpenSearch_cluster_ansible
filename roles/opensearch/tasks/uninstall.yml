- name: Остановка приложений
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop:
    - haproxy
    - opensearch-dashboards
    - opensearch
  ignore_errors: yes

- name: Удаление приложений
  ansible.builtin.shell:
    cmd: zypper remove -y opensearch openssl java-25-openjdk
  ignore_errors: yes

- name: Удаление конфигурации
  ansible.builtin.shell:
    cmd: rm -rf /etc/opensearch*